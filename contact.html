<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Student Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar" aria-label="Main navigation">
      <a href="index.html" class="logo">Your Name</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="planner.html">Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Me</h1>
    <div class="grid">
      <section class="card">
        <h2>Send a Message</h2>
        <form id="contactForm" novalidate>
          <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name">
            <span class="error" id="nameError" role="alert"></span>
          </div>
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com">
            <span class="error" id="emailError" role="alert"></span>
          </div>
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="08012345678">
            <span class="error" id="phoneError" role="alert"></span>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Type your message here..."></textarea>
            <span class="error" id="messageError" role="alert"></span>
          </div>
          <button type="submit" class="btn">Send Message</button>
          <div class="form-success" id="formSuccess" role="status"></div>
        </form>
      </section>

      <aside class="card">
        <h2>Other Ways to Reach Me</h2>
        <ul class="styled">
          <li>Email: <a href="mailto:you@example.com">you@example.com</a></li>
          <li>GitHub: <a href="https://github.com/your-username" target="_blank" rel="noopener">github.com/your-username</a></li>
          <li>LinkedIn: <a href="https://linkedin.com/in/your-username" target="_blank" rel="noopener">linkedin.com/in/your-username</a></li>
        </ul>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> Your Name. Built with HTML, CSS and JavaScript.</p>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
